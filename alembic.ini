[alembic]
script_location = infra/migrations
prepend_sys_path = .
path_separator = os
# Timezone-aware, monotonically-increasing revision filenames.
file_template = %%(rev)s_%%(slug)s

# The URL is supplied by env.py from DATABASE_URL; this line exists so
# `alembic` does not fail before the environment is loaded.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
