[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinloop"
version = "0.1.0"
description = "Event-driven, suspendable clinical workflow continuity agent (MVP, synthetic data only)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "ClinLoop Team" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools]
# Explicit package discovery; every path segment must contain __init__.py.
packages = [
    "apps",
    "apps.api",
    "apps.api.app",
    "apps.api.app.routes",
    "apps.worker",
    "apps.worker.worker",
    "apps.mcp_server",
    "apps.mcp_server.mcp_server",
    "packages",
    "packages.contracts",
    "packages.domain",
    "packages.fixtures",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:apps.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "node_modules", "apps/web", "infra/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"infra/migrations/**" = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
