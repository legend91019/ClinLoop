name: clinloop-demo

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/alibaba-demo/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: sqlite+pysqlite:////data/clinloop-demo.sqlite3
      EVENT_BUS: database
      AGENT_PROVIDER: ${AGENT_PROVIDER:-mock}
      NOTE_DRAFT_PROVIDER: ${NOTE_DRAFT_PROVIDER:-mock}
    command: >-
      sh -c "python -m scripts.init_product_demo --database-url
      sqlite+pysqlite:////data/clinloop-demo.sqlite3 &&
      exec uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./data:/data
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: deploy/alibaba-demo/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: sqlite+pysqlite:////data/clinloop-demo.sqlite3
      EVENT_BUS: database
      AGENT_PROVIDER: ${AGENT_PROVIDER:-mock}
      NOTE_DRAFT_PROVIDER: ${NOTE_DRAFT_PROVIDER:-mock}
    command: ["python", "scripts/run_worker.py"]
    volumes:
      - ./data:/data
    depends_on:
      - api
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: deploy/alibaba-demo/Dockerfile.web
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      - api
    ports:
      - "0.0.0.0:80:80"
    restart: unless-stopped
